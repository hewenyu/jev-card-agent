server {
    listen 80;
    listen [::]:80;
    server_name openpoker.zve.ccwu.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://openpoker.zve.ccwu.cc$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openpoker.zve.ccwu.cc;

    ssl_certificate /etc/letsencrypt/live/openpoker.zve.ccwu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openpoker.zve.ccwu.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OpenPokerTLS:10m;
    ssl_session_timeout 1d;

    location / {
        limit_except GET {
            deny all;
        }
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
